name: Collect servers

# Gathers every source outside the filtered network and publishes one
# deduplicated list on the "servers" branch, which the apps download
# instead of hundreds of sources (see cmd/collect).
on:
  schedule:
    # A safety net: each run starts the next one itself (the last step),
    # since GitHub delays and drops most of these scheduled runs. A run
    # that fails before that step, or a stopped chain, is picked up here.
    - cron: "*/5 * * * *"
  # A change to the collector or its lists publishes at once instead of
  # waiting for the schedule, which GitHub may also delay or skip.
  push:
    branches: [main]
    paths: ["cmd/collect/**", "internal/sources/**", ".github/workflows/collect.yml"]
  workflow_dispatch:

permissions:
  contents: write
  # To start the next collection itself (the last step).
  actions: write

# One collection at a time; a newer one waits instead of overlapping.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Collections run in the public repository alba-data (deploy/data-repo),
    # on its free minutes; here only while the variable COLLECT_IN_PRIVATE
    # is 1. Two collectors would race over the list keys.
    if: vars.COLLECT_IN_PRIVATE == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: servers
          path: prev
      # wrangler reads users' reports from the project's own storage and
      # puts the files back there (deploy/files/lib.sh).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Users' reports
        # What users' apps found works on their networks (crowd.json,
        # written hourly by the account service): confirmed servers go
        # first in hot.txt, failing ones are left out.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: backend
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler r2 object get albatross-files/list/servers/crowd.json --file "$RUNNER_TEMP/crowd.json" --remote || echo "::warning::no crowd.json yet"
            npx wrangler r2 object get albatross-files/list/servers/iran.json --file "$RUNNER_TEMP/iran.json" --remote || echo "::warning::no report from a tester inside the country yet (deploy/tester)"
            # Sources found by the hourly discovery (discover.yml).
            for f in sources.txt channels.txt; do
              npx wrangler r2 object get "albatross-files/list/servers/$f" --file "$RUNNER_TEMP/$f" --remote || echo "::warning::no discovered $f yet"
            done
            # The keys the lists were sealed with so far (the account
            # service hands them to signed-in users); this run adds one.
            # A failed read would start the keys afresh and drop the recent
            # ones, which copies of the lists still in caches need: retry.
            for _ in 1 2 3; do
              npx wrangler r2 object get albatross-files/private/listkeys.json --file "$RUNNER_TEMP/listkeys.json" --remote && break
              rm -f "$RUNNER_TEMP/listkeys.json"; sleep 10
            done
            [ -s "$RUNNER_TEMP/listkeys.json" ] || echo "::notice::no list keys yet; starting the first"
            # The links the project's own servers and relays stored
            # themselves (deploy/server/publish-links.sh), read with the
            # secrets' in the next step.
            for f in own-servers.txt own-relays.txt; do
              npx wrangler r2 object get "albatross-files/private/$f" --file "$RUNNER_TEMP/$f" --remote >/dev/null 2>&1 || rm -f "$RUNNER_TEMP/$f"
            done
          fi
      - name: Cores
        env:
          SINGBOX_VERSION: "1.14.4"
          XRAY_VERSION: "26.10.21"
        run: |
          mkdir -p /tmp/cores && cd /tmp/cores
          curl -fsSL --retry 4 -o sb.tgz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz"
          tar xzf sb.tgz --strip-components=1
          curl -fsSL --retry 4 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o x.zip xray
      - name: Collect
        env:
          # Servers in fresh.txt are connected through for real (cmd/collect/realtest.go).
          SING_BOX: /tmp/cores/sing-box
          XRAY: /tmp/cores/xray
          OWN_SERVERS: ${{ secrets.OWN_SERVERS }}
          # The relays inside the country (deploy/server relay mode), one link per line.
          OWN_RELAYS: ${{ secrets.OWN_RELAYS }}
          OWN_KEY: ${{ secrets.OWN_KEY }}
          # Raises globalping's quota for the check from inside Iran.
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
          # Tags of the project's own probes inside the country (dashboard), comma separated.
          GLOBALPING_TAGS: ${{ vars.GLOBALPING_TAGS }}
          LISTS_PLAIN: ${{ vars.LISTS_PLAIN }}
        # 15,000 real tests take a few minutes (most fail at once); the
        # address probe before them stops after ten (cmd/collect -probe-minutes).
        run: |
          # The own servers and relays: the secrets' links and the ones the
          # servers stored themselves, each once, kept out of the log.
          merge() { printf '%s\n' "$1"; cat "$2" 2>/dev/null; }
          OWN_SERVERS="$(merge "${OWN_SERVERS:-}" "$RUNNER_TEMP/own-servers.txt" | awk 'NF && !seen[$0]++')"
          OWN_RELAYS="$(merge "${OWN_RELAYS:-}" "$RUNNER_TEMP/own-relays.txt" | awk 'NF && !seen[$0]++')"
          while IFS= read -r l; do [ -n "$l" ] && echo "::add-mask::$l"; done <<<"$OWN_SERVERS"$'\n'"$OWN_RELAYS"
          export OWN_SERVERS OWN_RELAYS
          echo "own servers: $(grep -c . <<<"$OWN_SERVERS" || true) links; relays: $(grep -c . <<<"$OWN_RELAYS" || true)"
          # The lists go out sealed; the plain copies only while LISTS_PLAIN
          # is 1 (apps from before 1.0.2 were cut off by the forced update).
          go run ./cmd/collect -prev prev -real 15000 -probe-minutes 10 -crowd "$RUNNER_TEMP/crowd.json,$RUNNER_TEMP/iran.json" \
            -sources "$RUNNER_TEMP/sources.txt" -channels "$RUNNER_TEMP/channels.txt" -out "$RUNNER_TEMP/servers" \
            -keys "$RUNNER_TEMP/listkeys.json" -keys-out "$RUNNER_TEMP/listkeys.new.json" -plain="${LISTS_PLAIN:-0}"
          # The discovered lists travel with the servers branch too.
          for f in sources.txt channels.txt; do [ -f "$RUNNER_TEMP/$f" ] && cp "$RUNNER_TEMP/$f" "$RUNNER_TEMP/servers/$f"; done; true
      - name: Store this run's list key
        # Before any list sealed with it is published (the servers branch
        # and the project's storage below): the account service hands the
        # keys to the apps and opens the lists with them for subscriptions,
        # so a list out before its key reads as empty. The new lists are of
        # no use to anyone until this is stored, so it must succeed.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          . deploy/files/lib.sh
          if have_wrangler; then
            r2_put private/listkeys.json "$RUNNER_TEMP/listkeys.new.json" "application/json" "no-store"
            echo "stored this run's list key"
          else
            echo "::error::the list keys could not be stored: the Cloudflare credentials are missing"; exit 1
          fi
      # The collector itself, for a tester inside the country (deploy/tester).
      - name: Build the collector for the tester
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH=$arch go build -trimpath -buildvcs=false -ldflags "-s -w" -o "$RUNNER_TEMP/tools/collect-linux-$arch" ./cmd/collect
          done
          # install.sh carries run.sh inline: the two must not drift apart.
          diff <(sed -n "/^cat > run.sh <<'RUN'$/,/^RUN$/{//!p}" deploy/tester/install.sh) deploy/tester/run.sh
          cp deploy/tester/install.sh "$RUNNER_TEMP/tools/tester-install.sh"
          # The cores too, so a tester inside the country needs nothing from GitHub.
          [ -x /tmp/cores/sing-box ] && cp /tmp/cores/sing-box "$RUNNER_TEMP/tools/sing-box-linux-amd64"
          [ -x /tmp/cores/xray ] && cp /tmp/cores/xray "$RUNNER_TEMP/tools/xray-linux-amd64"
          true
      - name: Publish
        working-directory: ${{ runner.temp }}/servers
        run: |
          # One commit, replaced each run, so the branch never grows.
          git init -q -b servers
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Servers $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" servers
      - name: Publish to the project's own storage
        # The apps read the lists from there first (sources.Addresses), so
        # they keep working once the repository is private.
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LISTS_PLAIN: ${{ vars.LISTS_PLAIN }}
        run: |
          account="$(bash build/account-url.sh | cut -d, -f1)"
          files=()
          for f in hot.txt proven.txt new.txt fresh.txt all-1.txt all-2.txt all-3.txt all-4.txt all-5.txt all-6.txt all-7.txt all-8.txt tor.json meta.json iran-tcp.json reach.json own-0.bin own-1.bin own-2.bin own-3.bin own-4.bin; do
            [ -f "$RUNNER_TEMP/servers/$f" ] && files+=("$RUNNER_TEMP/servers/$f")
            [ -f "$RUNNER_TEMP/servers/$f.sealed" ] && files+=("$RUNNER_TEMP/servers/$f.sealed")
          done
          bash deploy/files/publish-lists.sh "$account" servers "${files[@]}"
          bash deploy/files/publish-lists.sh "$account" tools "$RUNNER_TEMP"/tools/*
          # Without plain copies, the stale plain lists in storage go too.
          if [ "${LISTS_PLAIN:-0}" != 1 ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            for f in hot.txt proven.txt new.txt fresh.txt all-1.txt all-2.txt all-3.txt all-4.txt all-5.txt all-6.txt all-7.txt all-8.txt own-0.bin own-1.bin own-2.bin own-3.bin own-4.bin; do
              (cd backend && npx wrangler r2 object delete "albatross-files/list/servers/$f" --remote >/dev/null 2>&1) || true
            done
          fi
      # The next collection, right away: the lists stay as fresh as one
      # collection takes (about twenty minutes). GitHub lets a run start a
      # workflow_dispatch with its own token. A private repository has
      # 2,000 free minutes a month, which this would spend in days, so
      # there the chain runs only when the variable COLLECT_CONTINUOUS is 1.
      # Only the default branch chains: a run on a pull request's branch
      # would start a chain of its own, and the queued runs of the two
      # chains cancel each other in the concurrency group.
      - name: Start the next collection
        if: always() && github.ref_name == github.event.repository.default_branch && (github.event.repository.private == false || vars.COLLECT_CONTINUOUS == '1')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "${GITHUB_REF_NAME}" || echo "::warning::the next collection could not be started; the schedule will"
