name: Deploy accounts and website

# Publishes backend/ (the account service) and site/ (the public website at
# albatrossvpn.online) to Cloudflare. Run it by hand from the Actions tab
# after setting the secrets and variables listed in backend/README.md.
on:
  workflow_dispatch:
    inputs:
      min_client:
        description: "Oldest app version that may still sign in and connect (e.g. 1.3.0); empty: only the update manifest's min_version counts"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check the settings
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SECRET ADMIN_USER ADMIN_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::The secret $v is not set (see backend/README.md)"; exit 1; }
          done
          [ ${#TOKEN_SECRET} -ge 32 ] || { echo "::error::TOKEN_SECRET must have at least 32 characters"; exit 1; }
          # The administrator's password is the one way into the panel and the
          # release tools: a short one is a risk worth a line in every run.
          [ ${#ADMIN_PASSWORD} -ge 16 ] || echo "::warning::ADMIN_PASSWORD has only ${#ADMIN_PASSWORD} characters; use 16 or more (random letters and digits) and set it again in the repository secrets."
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - name: Find or create the database
        run: |
          id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s).find(x=>x.name==="albatross");if(d)console.log(d.uuid)})')"
          if [ -z "$id" ]; then
            npx wrangler d1 create albatross
            id="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).find(x=>x.name==="albatross").uuid))')"
          fi
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Update the database
        run: npx wrangler d1 migrations apply DB --remote
      - name: Deploy
        env:
          DOMAIN: ${{ vars.SITE_DOMAIN }}
          SITE_NAME: ${{ vars.SITE_NAME }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
          COMPANY_ADDRESS: ${{ vars.COMPANY_ADDRESS }}
          # Cloudflare Email Routing forwards this address to the owner's inbox;
          # the CONTACT_EMAIL variable overrides it.
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'support@albatrossvpn.online' }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          MIN_CLIENT: ${{ inputs.min_client }}
        run: |
          if [ -n "$MIN_CLIENT" ] && ! [[ "$MIN_CLIENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::min_client must be three numbers like 1.3.0"; exit 1
          fi
          args=()
          [ -n "$DOMAIN" ] && args+=(--domain "$DOMAIN")
          [ -n "$SITE_NAME" ] && args+=(--var "SITE_NAME:$SITE_NAME")
          args+=(--var "COMPANY_NAME:$COMPANY_NAME" --var "COMPANY_ADDRESS:$COMPANY_ADDRESS" --var "CONTACT_EMAIL:$CONTACT_EMAIL" --var "SUPPORT_URL:$SUPPORT_URL")
          args+=(--var "MIN_CLIENT:$MIN_CLIENT")
          # The edge's name, from its own settings, so the service can hand out its links.
          edge="$(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' ../edge/wrangler.toml | head -1)"
          args+=(--var "EDGE_HOST:$edge")
          npx wrangler deploy "${args[@]}"
      - name: Encrypted Client Hello and HTTP/3 off for the websites
        # Iran's filtering drops TLS handshakes that carry ECH to Cloudflare
        # and throttles QUIC, and browsers do not always fall back: with
        # either on, the website and the account page open badly or not at
        # all from inside the country. Both are zone settings, so they go
        # off for every name on the zone. The app does not need them here:
        # it negotiates ECH per server where it works (internal/engine/ech.go
        # falls back to a plain handshake) and reaches the edge over TCP.
        # Zone settings need a token with Zone Settings: Edit; the secret
        # Cloudflare_API_edit holds one when the deploy token has not.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.Cloudflare_API_edit || secrets.CLOUDFLARE_API_TOKEN }}
          # The zone's id, for a token that may not list zones (Zone: Read):
          # the variable, else albatrossvpn.online's id (an id is not a secret).
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID || '10cb31d048a94862c5080fbd33c551bd' }}
        run: |
          rc=0
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          # Which kind of token this is, and whether it is live.
          for v in user/tokens/verify "accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify"; do
            echo "$v: $(curl -sS "${auth[@]}" "$api/$v" | jq -c '{success, status: .result.status, errors: [.errors[]?.message]}')"
          done
          for zone in $(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' wrangler.toml ../site/wrangler.toml ../edge/wrangler.toml | awk -F. '{print $(NF-1)"."$NF}' | sort -u); do
            id="$(curl -sS "${auth[@]}" "$api/zones?name=$zone" | jq -r '.result[0].id // empty')"
            [ -n "$id" ] || id="$CLOUDFLARE_ZONE_ID"
            [ -n "$id" ] || { echo "::warning::The API token cannot list the zone $zone (it needs Zone: Read), and the variable CLOUDFLARE_ZONE_ID is not set; turn ECH and HTTP/3 off in its dashboard (SSL/TLS > Edge Certificates, Network)."; rc=1; continue; }
            for setting in ech http3; do
              out="$(curl -sS -X PATCH "${auth[@]}" -H "Content-Type: application/json" --data '{"value":"off"}' "$api/zones/$id/settings/$setting")"
              echo "$zone $setting: $(echo "$out" | jq -c '{success, errors: [.errors[]?.message], value: .result.value}')"
              [ "$(echo "$out" | jq -r .success)" = true ] || { echo "::warning::$setting could not be turned off on $zone: the API token needs Zone Settings Edit, or turn it off in the dashboard."; rc=1; }
            done
          done
          exit $rc
      - name: Set the secrets
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          EDGE_EPOCH: ${{ vars.EDGE_EPOCH }}
        run: |
          for v in TOKEN_SECRET ADMIN_USER ADMIN_PASSWORD; do
            printf '%s' "${!v}" | npx wrangler secret put "$v"
          done
          # The edge's user id, the same one the edge job derives (edge/README.md).
          printf '%s' "$(../edge/uuid.sh)" | npx wrangler secret put EDGE_UUID
      - name: Keep the current release's files in storage
        # The website serves them (/download/); a release stores its own
        # files, this covers the release before that and a new bucket.
        env:
          # The repository's releases are not public: the files come as the workflow.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          account="https://$(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' wrangler.toml | head -1)"
          site="https://$(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' ../site/wrangler.toml | head -1)"
          jq -r '.files | to_entries[] | .value | "\(.urls[] | select(startswith("https://github.com/"))) \(.sha256)"' ../update.json | sort -u |
            while read -r url sha; do
              bash ../deploy/files/push.sh "$account" "$site" "${url##*/}" "$url" "$sha" || echo "::warning::$url could not be stored; the website will serve it once a release or a later deploy stores it."
            done
      # The app's own files (lists, ad list, update manifest) from the
      # branches CI publishes them to, so the storage holds them from the
      # first deploy on; the collectors and releases keep them current.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: servers
          path: branch-servers
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: rules
          path: branch-rules
      - name: Keep the app's own files in storage
        env:
          ADMIN_USER: ${{ secrets.ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          LISTS_PLAIN: ${{ vars.LISTS_PLAIN }}
        run: |
          account="https://$(sed -n 's/.*pattern *= *"\([^"]*\)", *custom_domain *= *true.*/\1/p' wrangler.toml | head -1)"
          publish() { # branch dir names...
            local branch="$1" dir="$2" files=() f
            shift 2
            for f in "$@"; do [ -f "$dir/$f" ] && files+=("$dir/$f"); done
            if [ ${#files[@]} -eq 0 ]; then echo "::warning::nothing to store from the $branch branch"; return 0; fi
            bash ../deploy/files/publish-lists.sh "$account" "$branch" "${files[@]}" || echo "::warning::the $branch files could not all be stored"
          }
          lists=()
          for f in hot.txt proven.txt new.txt fresh.txt all-1.txt all-2.txt all-3.txt all-4.txt all-5.txt all-6.txt all-7.txt all-8.txt own-0.bin own-1.bin own-2.bin own-3.bin own-4.bin; do
            lists+=("$f.sealed")
            # The plain copies, only while LISTS_PLAIN is 1 (collect.yml).
            [ "${LISTS_PLAIN:-0}" = 1 ] && lists+=("$f")
          done
          publish servers ../branch-servers "${lists[@]}" tor.json meta.json reach.json
          publish rules ../branch-rules ads.srs ads.json README.md LICENSE-GPL-3.0.txt LICENSE-AGPL-3.0.txt
          # The manifest only moves forward: a deploy from a branch behind
          # main must not put an older manifest over the released one (the
          # 1.0.0 release was undone that way for an evening). The stored
          # copy's version is compared with this checkout's.
          stored="$(curl -fsS --max-time 30 "$account/list/main/update.json" 2>/dev/null | jq -r '.latest_version // empty')"
          mine="$(jq -r '.latest_version // empty' ../update.json)"
          if [ -n "$stored" ] && [ "$(printf '%s\n%s\n' "$stored" "$mine" | sort -V | tail -1)" != "$mine" ]; then
            echo "::notice::update.json kept as stored ($stored): this checkout's is older ($mine)."
          else
            publish main .. update.json
          fi

  edge:
    # The edge: a Worker that carries the app's traffic (edge/README.md).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Deploy the edge
        env:
          PROXY_IP: ${{ vars.EDGE_PROXY_IP }}
        run: |
          args=()
          [ -n "$PROXY_IP" ] && args+=(--var "PROXY_IP:$PROXY_IP")
          npx wrangler deploy --config ../edge/wrangler.toml "${args[@]}"
      - name: Set the edge's user id
        env:
          TOKEN_SECRET: ${{ secrets.TOKEN_SECRET }}
          EDGE_EPOCH: ${{ vars.EDGE_EPOCH }}
        run: printf '%s' "$(../edge/uuid.sh)" | npx wrangler secret put EDGE_UUID --config ../edge/wrangler.toml

  site:
    # The public website: static pages on the zone's bare domain and www.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Clear hand-made records on the website's names
        # A Worker custom domain cannot be created while the name has an
        # ordinary A/AAAA/CNAME record (error 100117), so such records are
        # removed first. Records Cloudflare manages itself are left alone.
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          zone="$(curl -sS -H "$auth" "$api/zones?name=albatrossvpn.online" | jq -r '.result[0].id // empty')"
          if [ -z "$zone" ]; then echo "::warning::The token cannot read the zone; delete the A/CNAME records of albatrossvpn.online and www by hand if the deploy fails."; exit 0; fi
          for host in albatrossvpn.online www.albatrossvpn.online; do
            list="$(curl -sS -H "$auth" "$api/zones/$zone/dns_records?name=$host&per_page=100")"
            if [ "$(jq -r '.success' <<<"$list")" != true ]; then
              echo "::warning::The token cannot read the zone's DNS records ($(jq -c '.errors' <<<"$list")). Give it Zone > DNS > Edit, or delete the A/AAAA/CNAME records of $host by hand in the Cloudflare dashboard."
              continue
            fi
            jq -r '.result[] | select((.type=="A" or .type=="AAAA" or .type=="CNAME") and ((.meta.read_only // false) | not)) | .id + " " + .type + " " + .content' <<<"$list" \
              | while read -r id type content; do
                  echo "removing $type $host -> $content"
                  curl -sS -o /dev/null -w "  delete: %{http_code}\n" -X DELETE -H "$auth" "$api/zones/$zone/dns_records/$id" || true
                done
          done
      - name: Deploy the website
        run: npx wrangler deploy --config ../site/wrangler.toml
